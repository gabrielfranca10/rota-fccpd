<svg viewBox="0 0 1200 930" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arquitetura do protótipo, em fluxo de cima para baixo: clientes enviam HTTP; a camada HTTP entrega pedidos a uma fila de ingestão consumida por 4 threads; essas threads leem e escrevem o trânsito, os restaurantes/pedidos e as agendas dos entregadores, cada um protegido por seu lock; uma thread de recálculo atualiza o trânsito periodicamente; pedidos sem vaga vão para uma fila de espera até serem despachados; uma thread de monitor varre essa fila e emite alertas; e a MainThread supervisiona todas as threads.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="930" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Arquitetura do protótipo — um processo, várias threads</text>
  <text x="30" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">rota — núcleo de despacho de pedidos (Entrega 1) · fluxo de cima para baixo</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">

    <!-- Clients -->
    <rect x="230" y="70" width="220" height="50" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="340" y="99" text-anchor="middle" font-size="13" fill="#0f172a">App do entregador</text>

    <rect x="470" y="70" width="260" height="50" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="600" y="93" text-anchor="middle" font-size="13" fill="#0f172a">Integrações das plataformas</text>
    <text x="600" y="109" text-anchor="middle" font-size="11" fill="#64748b">iFood · Uber Eats · Rappi</text>

    <rect x="750" y="70" width="220" height="50" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="860" y="99" text-anchor="middle" font-size="13" fill="#0f172a">scripts/carga.py</text>

    <line x1="600" y1="120" x2="600" y2="192" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="615" y="140" font-size="11" fill="#334155">HTTP/1.0 + JSON</text>

    <!-- Process boundary -->
    <rect x="40" y="152" width="1120" height="692" rx="10" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="58" y="174" font-size="13" font-weight="600" fill="#334155">processo Python (single-node)</text>

    <!-- HTTP layer (acceptor + pool combined) -->
    <rect x="350" y="192" width="500" height="56" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="600" y="214" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">http-aceitador  →  pool http-0…31</text>
    <text x="600" y="232" text-anchor="middle" font-size="10" fill="#1e3a8a">1 thread aceita conexões · até 32 threads tratam requisições (ThreadPoolExecutor)</text>

    <line x1="600" y1="248" x2="600" y2="278" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="615" y="260" font-size="10" fill="#334155">enfileira pedido</text>

    <!-- Nucleo boundary -->
    <rect x="70" y="272" width="1060" height="478" rx="10" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="88" y="292" font-size="13" font-weight="600" fill="#334155">Núcleo (rota/nucleo.py)</text>

    <!-- Fila de ingestao -->
    <rect x="450" y="278" width="300" height="52" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="600" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">Fila de ingestão</text>
    <text x="600" y="316" text-anchor="middle" font-size="10" fill="#78350f">queue.Queue(1000) — dedup sob L4</text>

    <!-- bus: fila -> workers -->
    <line x1="600" y1="330" x2="600" y2="350" stroke="#475569" stroke-width="1.5"/>
    <line x1="345" y1="350" x2="855" y2="350" stroke="#475569" stroke-width="1.5"/>
    <line x1="345" y1="350" x2="345" y2="368" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="515" y1="350" x2="515" y2="368" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="685" y1="350" x2="685" y2="368" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="855" y1="350" x2="855" y2="368" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- ingestao threads -->
    <rect x="275" y="368" width="140" height="54" rx="27" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="345" y="399" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">ingestao-0</text>
    <rect x="445" y="368" width="140" height="54" rx="27" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="515" y="399" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">ingestao-1</text>
    <rect x="615" y="368" width="140" height="54" rx="27" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="685" y="399" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">ingestao-2</text>
    <rect x="785" y="368" width="140" height="54" rx="27" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="855" y="399" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">ingestao-3</text>
    <text x="90" y="438" font-size="10" fill="#64748b">4 consumidores — cada um processa um pedido por vez, calcula hora limite e tenta atribuir menor carga</text>

    <!-- bus: workers -> shared state -->
    <line x1="600" y1="422" x2="600" y2="447" stroke="#475569" stroke-width="1.5"/>
    <line x1="250" y1="447" x2="950" y2="447" stroke="#475569" stroke-width="1.5"/>
    <line x1="250" y1="447" x2="250" y2="472" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="600" y1="447" x2="600" y2="472" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="950" y1="447" x2="950" y2="472" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- shared state row -->
    <rect x="90" y="472" width="320" height="92" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="250" y="500" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Trânsito (imutável, versão N)</text>
    <text x="250" y="518" text-anchor="middle" font-size="10" fill="#334155">RWLock, preferência ao escritor</text>
    <rect x="366" y="480" width="34" height="20" rx="4" fill="#dc2626"/>
    <text x="383" y="494" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">L1</text>

    <rect x="440" y="472" width="320" height="92" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="600" y="500" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Restaurantes + Pedidos</text>
    <text x="600" y="518" text-anchor="middle" font-size="10" fill="#334155">1 lock por restaurante</text>
    <rect x="716" y="480" width="34" height="20" rx="4" fill="#dc2626"/>
    <text x="733" y="494" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">L2</text>

    <rect x="790" y="472" width="320" height="92" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="950" y="500" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Agendas dos entregadores</text>
    <text x="950" y="518" text-anchor="middle" font-size="10" fill="#334155">1 lock por entregador, ordem por id</text>
    <rect x="1066" y="480" width="34" height="20" rx="4" fill="#dc2626"/>
    <text x="1083" y="494" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">L3</text>

    <text x="600" y="552" text-anchor="middle" font-size="10" fill="#64748b">leituras (GET) também passam por aqui, sob o mesmo lock em modo compartilhado</text>

    <!-- recalculo -->
    <rect x="90" y="584" width="190" height="56" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
    <text x="185" y="606" text-anchor="middle" font-size="11" font-weight="600" fill="#581c87">recalculo · 1 thread</text>
    <text x="185" y="622" text-anchor="middle" font-size="9" fill="#581c87">atualiza o trânsito periodicamente</text>
    <line x1="200" y1="584" x2="240" y2="564" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="10" y="577" font-size="9" fill="#334155">escreve nova versão (L1)</text>

    <!-- dispatch flow -->
    <rect x="330" y="584" width="200" height="56" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="430" y="606" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">Fila de espera</text>
    <text x="430" y="622" text-anchor="middle" font-size="10" fill="#78350f">_aguardando — sob L4</text>

    <rect x="580" y="584" width="200" height="56" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="680" y="606" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">Fila de despacho</text>
    <text x="680" y="622" text-anchor="middle" font-size="10" fill="#78350f">sinal "pode haver vaga"</text>

    <rect x="830" y="584" width="160" height="56" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <text x="910" y="606" text-anchor="middle" font-size="11" font-weight="600" fill="#7c2d12">despacho · 1 thread</text>
    <text x="910" y="622" text-anchor="middle" font-size="9" fill="#7c2d12">atribui ao mais urgente</text>

    <line x1="600" y1="564" x2="435" y2="584" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="440" y="577" font-size="9" fill="#334155">sem vaga</text>

    <line x1="530" y1="612" x2="580" y2="612" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="780" y1="612" x2="830" y2="612" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

    <line x1="900" y1="584" x2="940" y2="564" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="905" y="577" font-size="9" fill="#334155">atribui (L2+L3)</text>

    <!-- bottom row: indices, alertas, monitor -->
    <rect x="90" y="674" width="220" height="54" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="200" y="698" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Índices globais</text>
    <text x="200" y="714" text-anchor="middle" font-size="10" fill="#334155">restaurantes · entregadores · pedidos</text>
    <rect x="266" y="680" width="34" height="20" rx="4" fill="#dc2626"/>
    <text x="283" y="694" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">L4</text>

    <rect x="340" y="674" width="240" height="54" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="460" y="698" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Alertas + Métricas</text>
    <text x="460" y="714" text-anchor="middle" font-size="10" fill="#334155">buffer circular · contadores</text>
    <rect x="536" y="680" width="34" height="20" rx="4" fill="#dc2626"/>
    <text x="553" y="694" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">L5</text>

    <rect x="610" y="674" width="160" height="54" rx="27" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="690" y="698" text-anchor="middle" font-size="11" font-weight="600" fill="#115e59">monitor · 1 thread</text>
    <text x="690" y="714" text-anchor="middle" font-size="9" fill="#115e59">Event.wait(1s)</text>

    <text x="90" y="656" font-size="10" fill="#64748b">monitor varre a fila de espera e emite EM_RISCO / ATRASADO</text>
    <line x1="650" y1="674" x2="450" y2="640" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="610" y1="701" x2="580" y2="701" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- MainThread -->
    <rect x="90" y="770" width="1020" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="600" y="794" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">MainThread</text>
    <text x="600" y="812" text-anchor="middle" font-size="10" fill="#475569">sobe e supervisiona todas as threads · aguarda Ctrl+C / SIGTERM · desligamento gracioso</text>
  </g>

  <!-- Legend -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#334155">
    <circle cx="60" cy="861" r="6" fill="#eff6ff" stroke="#3b82f6"/><text x="74" y="865">thread HTTP</text>
    <circle cx="340" cy="861" r="6" fill="#ecfdf5" stroke="#10b981"/><text x="354" y="865">thread de ingestão</text>
    <circle cx="620" cy="861" r="6" fill="#faf5ff" stroke="#a855f7"/><text x="634" y="865">thread de recálculo</text>
    <circle cx="900" cy="861" r="6" fill="#fff7ed" stroke="#f97316"/><text x="914" y="865">thread de despacho</text>

    <circle cx="60" cy="886" r="6" fill="#f0fdfa" stroke="#14b8a6"/><text x="74" y="890">thread de monitor</text>
    <rect x="334" y="880" width="12" height="12" fill="#f8fafc" stroke="#334155"/><text x="354" y="890">estado compartilhado</text>
    <rect x="614" y="880" width="12" height="12" fill="#fffbeb" stroke="#d97706"/><text x="634" y="890">fila (queue.Queue)</text>
    <rect x="894" y="880" width="16" height="12" rx="3" fill="#dc2626"/><text x="916" y="890">nível do lock (L1…L5)</text>
  </g>
</svg>
