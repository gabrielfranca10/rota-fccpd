<svg viewBox="0 0 1400 1060" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arquitetura-alvo distribuída: gateway e API sem estado recebem webhooks e chamadas REST, publicam numa fila durável, que alimenta o Serviço de Pedidos particionado por restaurante com réplicas, que conversa por gRPC com o serviço de Frota e emite um stream de pedidos em risco. Abaixo, tabela mostrando para onde cada peça do protótipo evolui.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1060" fill="#ffffff"/>

  <text x="30" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Arquitetura-alvo (distribuída) — para onde o protótipo evolui</text>
  <text x="30" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Entregas 2–4: serviços separados, comunicação por gRPC, particionamento por restaurante, tolerância a falhas</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- sources -->
    <rect x="120" y="76" width="300" height="50" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="270" y="106" text-anchor="middle" font-size="12" fill="#0f172a">Plataformas (iFood, Uber Eats…)</text>

    <rect x="620" y="76" width="240" height="50" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="740" y="106" text-anchor="middle" font-size="12" fill="#0f172a">App do entregador</text>

    <line x1="270" y1="126" x2="270" y2="164" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="280" y="150" font-size="10" fill="#334155">webhooks</text>
    <line x1="740" y1="126" x2="740" y2="164" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="750" y="150" font-size="10" fill="#334155">REST</text>

    <!-- gateway / api -->
    <rect x="120" y="168" width="300" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="270" y="194" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Gateway</text>
    <text x="270" y="210" text-anchor="middle" font-size="9.5" fill="#1e3a8a">recebe webhooks das plataformas</text>

    <rect x="500" y="168" width="360" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="680" y="194" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">API / BFF</text>
    <text x="680" y="210" text-anchor="middle" font-size="9.5" fill="#1e3a8a">sem estado; várias réplicas atrás de balanceador</text>

    <line x1="420" y1="196" x2="496" y2="196" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="496" y1="210" x2="420" y2="210" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- fila duravel -->
    <line x1="270" y1="232" x2="270" y2="270" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="280" y="256" font-size="10" fill="#334155">publica</text>

    <rect x="120" y="274" width="300" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="270" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#78350f">Fila durável</text>
    <text x="270" y="316" text-anchor="middle" font-size="9.5" fill="#78350f">RabbitMQ / Kafka — at-least-once</text>

    <!-- servico de pedidos -->
    <line x1="330" y1="338" x2="500" y2="404" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="360" y="366" font-size="10" fill="#334155">gRPC</text>

    <line x1="680" y1="232" x2="680" y2="396" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="690" y="320" font-size="10" fill="#334155">gRPC</text>
    <text x="690" y="334" font-size="10" fill="#334155">(confirmar / redespachar / consultar)</text>

    <rect x="500" y="400" width="360" height="120" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
    <text x="680" y="424" text-anchor="middle" font-size="13" font-weight="600" fill="#581c87">Serviço de Pedidos</text>
    <text x="680" y="440" text-anchor="middle" font-size="9.5" fill="#581c87">particionado por restaurante · réplicas</text>

    <rect x="520" y="454" width="90" height="46" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/>
    <text x="565" y="472" text-anchor="middle" font-size="9.5" fill="#581c87">nó dono</text>
    <text x="565" y="486" text-anchor="middle" font-size="9.5" fill="#581c87">restaurantes A–I</text>

    <rect x="635" y="454" width="90" height="46" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/>
    <text x="680" y="472" text-anchor="middle" font-size="9.5" fill="#581c87">nó dono</text>
    <text x="680" y="486" text-anchor="middle" font-size="9.5" fill="#581c87">restaurantes J–R</text>

    <rect x="750" y="454" width="90" height="46" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/>
    <text x="795" y="472" text-anchor="middle" font-size="9.5" fill="#581c87">nó dono</text>
    <text x="795" y="486" text-anchor="middle" font-size="9.5" fill="#581c87">restaurantes S–Z</text>

    <!-- frota -->
    <line x1="864" y1="440" x2="936" y2="440" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="936" y1="454" x2="864" y2="454" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="870" y="434" font-size="9.5" fill="#334155">gRPC</text>

    <rect x="940" y="400" width="220" height="120" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text x="1050" y="436" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Frota</text>
    <text x="1050" y="454" text-anchor="middle" font-size="10" fill="#334155">entregadores</text>

    <!-- notificacoes / painel -->
    <line x1="680" y1="520" x2="680" y2="568" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="695" y="548" font-size="10" fill="#334155">stream AcompanharPedidosEmRisco</text>

    <rect x="500" y="572" width="360" height="60" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="680" y="598" text-anchor="middle" font-size="13" font-weight="600" fill="#115e59">Notificações / painel</text>
    <text x="680" y="614" text-anchor="middle" font-size="9.5" fill="#115e59">retomada pelo cursor "desde"</text>
  </g>

  <line x1="0" y1="668" x2="1400" y2="668" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- mapping table -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="30" y="702" font-size="14" font-weight="700" fill="#0f172a">Do protótipo (Entrega 1) para a arquitetura-alvo</text>

    <!-- rows -->
    <!-- helper layout: left chip x=30 w=430, arrow, right chip x=520 w=850 -->
    <g font-size="11">
      <!-- row 1 -->
      <rect x="30" y="722" width="430" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
      <text x="46" y="746" fill="#78350f">queue.Queue limitada</text>
      <line x1="466" y1="742" x2="510" y2="742" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrow)"/>
      <rect x="520" y="722" width="850" height="40" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
      <text x="536" y="746" fill="#0f172a">fila durável (at-least-once) + consumidor idempotente pela impressão digital</text>

      <!-- row 2 -->
      <rect x="30" y="772" width="430" height="40" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
      <text x="46" y="796" fill="#7c2d12">Lock por restaurante (L2)</text>
      <line x1="466" y1="792" x2="510" y2="792" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrow)"/>
      <rect x="520" y="772" width="850" height="40" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
      <text x="536" y="796" fill="#0f172a">partição por restaurante: cada restaurante tem UM nó dono (sem lock distribuído no caminho comum)</text>

      <!-- row 3 -->
      <rect x="30" y="822" width="430" height="40" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.2"/>
      <text x="46" y="846" fill="#713f12">ordem de locks das agendas (L3)</text>
      <line x1="466" y1="842" x2="510" y2="842" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrow)"/>
      <rect x="520" y="822" width="850" height="40" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
      <text x="536" y="846" fill="#0f172a">mesma regra aplicada a locks/leases distribuídos, ou saga com compensação</text>

      <!-- row 4 -->
      <rect x="30" y="872" width="430" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="46" y="896" fill="#7f1d1d">Trânsito imutável + versão (L1)</text>
      <line x1="466" y1="892" x2="510" y2="892" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrow)"/>
      <rect x="520" y="872" width="850" height="40" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
      <text x="536" y="896" fill="#0f172a">trânsito versionado replicado; pedido guarda a versão usada (já guarda hoje)</text>

      <!-- row 5 -->
      <rect x="30" y="922" width="430" height="40" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
      <text x="46" y="946" fill="#334155">calcular_hora_limite (função pura)</text>
      <line x1="466" y1="942" x2="510" y2="942" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrow)"/>
      <rect x="520" y="922" width="850" height="40" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
      <text x="536" y="946" fill="#0f172a">RPC unário do contrato rota.pedido.v1</text>

      <!-- row 6 -->
      <rect x="30" y="972" width="430" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <text x="46" y="996" fill="#14532d">Alertas por polling (cursor)</text>
      <line x1="466" y1="992" x2="510" y2="992" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrow)"/>
      <rect x="520" y="972" width="850" height="40" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
      <text x="536" y="996" fill="#0f172a">RPC server-streaming AcompanharPedidosEmRisco (retomada pelo cursor "desde")</text>

      <!-- row 7 -->
      <rect x="30" y="1022" width="430" height="30" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
      <text x="46" y="1042" fill="#1e3a8a">Relógio local</text>
      <line x1="466" y1="1037" x2="510" y2="1037" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrow)"/>
      <rect x="520" y="1022" width="850" height="30" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
      <text x="536" y="1042" fill="#0f172a">relógios não sincronizados entre nós → instantes com versão lógica, não só timestamp</text>
    </g>
  </g>
</svg>
